spring.application.name=gestor-tareas

server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gestor_tareas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-por-uno-largo-y-random-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
